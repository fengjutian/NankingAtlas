name: CI

# 触发：所有 push 到 main 和任何 PR；允许通过 workflow_dispatch 手动跑（debug 用）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消同一 ref 上仍在跑的旧运行，避免 PR 反复 push 时排队堆积。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：只读 + PR 评论。jobs 自身用不到的 token 默认不分配。
permissions:
  contents: read

env:
  # 全局 NODE / PNPM 版本，jobs 复用。
  NODE_VERSION: '20.18.0'
  PNPM_VERSION: '11.13.1'

jobs:
  # ---- 0. 一次性 install + 缓存 ----
  install:
    name: Install (frozen lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ---- 1. Prettier 格式 ----
  format:
    name: Format check
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      # 必须自己装：`needs: install` 只保证 pnpm store 缓存已预热，
      # GitHub Actions 的 job 各自跑在**全新 runner** 上，node_modules 不会跨 job 传递。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check

  # ---- 2. ESLint ----
  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm lint

  # ---- 3. TypeScript strict ----
  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # ---- 4. Unit / integration tests ----
  test:
    name: Test
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # SQLite 方案（P1-01.a 切换）：文件路径相对仓库根；CI 上跑完即丢弃。
      DATABASE_URL: file:./packages/database/prisma/test.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      # P1-01.b 起：生成 Prisma client 并在临时 test.db 上跑 migrate deploy，
      # 验证迁移可在全新数据库上重放（AGENTS.md §7.5）。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @nanking-atlas/database prisma:generate
      - name: Prisma migrate deploy (test.db)
        working-directory: packages/database
        run: pnpm exec prisma migrate deploy --schema prisma/schema.prisma
      - run: pnpm test
      # P1-02 ~ P1-10：API 集成测试（真实 SQLite 库 + 全局守卫 + 异常过滤器）。
      # 与单测分开跑：集成测试需要 globalSetup 在空库上执行迁移，耗时更长。
      - name: API integration tests
        run: pnpm test:integration
      # P1-11：OpenAPI 契约。先生成规范与前端类型客户端，再对比基线拦截 breaking change
      # （技术方案 §7.3：接口变更必须先更新契约与测试）。
      - name: OpenAPI generate
        run: pnpm --filter @nanking-atlas/api openapi:generate
      - name: OpenAPI breaking-change check
        run: pnpm --filter @nanking-atlas/api openapi:check-breaking
      # 后续 P1-02 起追加 prisma seed 调用。

  # ---- 5. Production build ----
  build:
    name: Build (web / admin / api)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        # P0 阶段 web 的 build 需要 .env.production 提供 NEXT_PUBLIC_APP_ENV。
        # 这是 Next.js "Collecting page data" 的强制要求。真实部署必须由部署平台注入。
        run: pnpm build
      - name: Upload web build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7
      - name: Upload admin build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: apps/admin/dist
          retention-days: 7
      - name: Upload api build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: api-build
          path: apps/api/dist
          retention-days: 7

  # ---- 6. E2E (P4-03) ----
  # 技术方案 §15 把「E2E smoke」列为主分支步骤；这里在 PR 上也跑 ——
  # 门禁只在合入后生效就太晚了（例如「撤回后仍返回 200」这类缺陷
  # 本来应该在改动它的那个 PR 就被拦下）。
  e2e:
    name: E2E (Playwright / chromium)
    needs: install
    runs-on: ubuntu-latest
    # 比 test/build 都长：globalSetup 会重新构建 web，再起两个服务跑浏览器。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        run: pnpm --filter @nanking-atlas/database prisma:generate
      # --with-deps 装 Chromium 需要的系统库（ubuntu runner 缺 libnss3 等）。
      # Playwright 浏览器缓存在 ~/.cache/ms-playwright，用 actions/cache 复用，
      # 否则每个 PR 都要重新下 ~440 MB。
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # E2E 用独立库 e2e/e2e.db（由 globalSetup 在空库上跑真实迁移建出），
      # 不复用 test.db，也不污染 dev.db。
      - name: Run E2E
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # ---- 7. Dependency scan (P4-02) ----
  # 技术方案 §15 要求每个 PR 跑 dependency scan。
  #
  # 只卡 **生产依赖**（--prod）：dev 依赖里的高危（@nestjs/cli 链上的 glob/braces/tmp、
  # vitest/tinypool/vite）只在本机与 CI 使用，不进入生产运行时，强行清零会
  # 把 Nest 主版本或测试栈整体抬升，属于架构级变更，需 ADR + 人工批准。
  # 这些 dev 依赖的处置记录在 docs/adr/0002-dependency-vulnerability-policy.md。
  dependency-scan:
    name: Dependency scan (production)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # ---- 8. Secret scan ----
  # AGENTS.md §4.6：不得提交真实秘密/密码/token/Cookie/生产 URL 凭据。
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # gitleaks 需要上传 SARIF 报告到 Security tab；只读 + security-events 写入。
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
