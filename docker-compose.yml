name: nanking-atlas

# 本地开发用 PostgreSQL + PostGIS + pg_trgm 容器。
#
# 启动：`docker compose up -d`（在仓库根目录）
# 默认端口 5432；DATABASE_URL 见 apps/api/.env.example。
#
# 容器首次启动会自动执行 ./docker/postgres/init/*.sql，
# 启用 PostGIS、pg_trgm、citext、uuid-ossp 等扩展。
# 数据卷命名为 `nanking_atlas_pg_data`，跨 `down/up` 保留。
# 真实开发凭据请用 `docker compose --env-file .env.local up`。

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: nanking-atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nanking_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-nanking_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nanking_atlas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nanking_atlas_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nanking_atlas_pg_data:
    name: nanking_atlas_pg_data